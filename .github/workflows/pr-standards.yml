name: Git Standards

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [develop, main, "epic/**"]

permissions:
  contents: read

jobs:
  branch-rules:
    name: Git standard revision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "${GITHUB_REPOSITORY,,}" == "leo-garnica/umssy-app-deploy" ]]; then
            PERSONAL_BRANCH='^(feature|fix|hotfix|refactor|docs|test|chore|ci|integrate|epic)/[a-z0-9]+(-[a-z0-9]+)*$'
            if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == "main" || "$HEAD_REF" =~ $PERSONAL_BRANCH ]]; then
              echo "Personal deployment branch name is valid."
              exit 0
            fi
            echo "::error::Use <type>/<lowercase-description> for deployment branches."
            exit 1
          fi
          bash scripts/check-branch-name.sh "$HEAD_REF"

      - name: Validate integration flow
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          if [[ "${GITHUB_REPOSITORY,,}" == "leo-garnica/umssy-app-deploy" && "$BASE_REF" == "main" ]]; then
            echo "Personal deployment repository: PRs may integrate directly into main."
            exit 0
          fi

          DEVELOP_SOURCES='^(epic/|hotfix/|[a-z]+/devops-)'
          EPIC_SOURCE='^epic/'

          echo "Source branch: $HEAD_REF | Target branch: $BASE_REF"

          case "$BASE_REF" in
            main)
              [[ "$HEAD_REF" == "develop" ]] \
                || fail "Merge to main is only allowed from develop, at the end of the sprint."
              ;;
            develop)
              [[ "$HEAD_REF" =~ $DEVELOP_SOURCES ]] \
                || fail "Merge to develop is only allowed from epic/* (or hotfix and devops branches from leads and DevOps)."
              ;;
            epic/*)
              [[ ! "$HEAD_REF" =~ $EPIC_SOURCE ]] \
                || fail "Direct merges between epic/* branches are forbidden. Merge to develop and pull from develop."
              ;;
          esac

          echo "Integration flow is correct."

  repo-guards:
    name: CI Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block CI changes outside DevOps branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${GITHUB_REPOSITORY,,}" == "leo-garnica/umssy-app-deploy" ]]; then
            echo "Personal deployment repository: CI may be maintained in the same PR."
            exit 0
          fi

          DEVOPS_BRANCH='^[a-z]+/devops-'
          if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" =~ $DEVOPS_BRANCH ]]; then
            echo "DevOps branch or sprint release: skipping this check."
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- .github/ scripts/)
          if [[ -n "$changed" ]]; then
            echo "::error::Only DevOps branches can modify CI and scripts."
            echo "$changed"
            exit 1
          fi
